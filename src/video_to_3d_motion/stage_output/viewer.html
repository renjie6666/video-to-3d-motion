<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>三维姿态验证</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111820;color:#e5eaf0;font:14px system-ui,"Microsoft YaHei",sans-serif}main{max-width:1400px;margin:auto;padding:24px}h1{font-size:23px;margin:0 0 8px}h2{font-size:16px;margin:0 0 10px}.muted{color:#a2afbd;font-size:13px;line-height:1.7}.layout{display:grid;grid-template-columns:minmax(500px,1.5fr) minmax(300px,1fr);gap:20px;margin-top:18px}.scene{background:#17222d;border:1px solid #304151;border-radius:8px;overflow:hidden}canvas{display:block;width:100%;height:540px;cursor:grab;touch-action:none}.toolbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-top:1px solid #304151}button,select{background:#243646;border:1px solid #43596a;border-radius:4px;color:#e5eaf0;padding:6px 10px;font:inherit}button{cursor:pointer}input[type=range]{accent-color:#65bcea;flex:1;min-width:150px}aside{display:flex;flex-direction:column;gap:18px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{padding:12px 8px;border-bottom:1px solid #43596a}.stat strong{display:block;font-size:22px;margin-top:5px}.stat small{color:#a2afbd}.imagebox{background:#17222d;text-align:center;min-height:180px}.imagebox img{max-width:100%;height:300px;object-fit:contain}.details{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #304151}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:8px 0}.legend{padding:8px 14px;color:#a2afbd}.legend span{margin-right:12px}.blue{color:#72b5ef}.red{color:#ef8d8d}.gt{color:#adbbc7}.note{padding:14px 0;line-height:1.7;color:#a2afbd}.error{color:#ef8d8d}@media(max-width:900px){.layout{grid-template-columns:1fr}canvas{height:440px}main{padding:12px}}
</style></head><body><main>
<h1>三维姿态验证</h1><div id="sequence" class="muted"></div>
<div class="layout"><section class="scene"><canvas id="scene" aria-label="可旋转三维骨架"></canvas>
<div class="legend"><span class="blue">预测右侧</span><span class="red">预测左侧</span><span class="gt">标注</span>拖动旋转 · 滚轮缩放</div>
<div class="toolbar"><button id="play">播放</button><button id="previous">上一帧</button><button id="next">下一帧</button><input id="timeline" type="range" min="0" value="0" step="1"><span id="position"></span></div>
<div class="toolbar"><label>播放速度 <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label><button id="reset">重置视角</button><label><input type="checkbox" id="jointIndices">关节编号</label></div>
</section><aside><section><h2>整段指标 · mm</h2><div class="stats"><div class="stat"><small>官方 2.5D P1 MPJPE · 当前帧集</small><strong id="officialMetric">—</strong></div><div class="stat"><small>N-MPJPE</small><strong id="nMetric">—</strong></div><div class="stat"><small>PA-MPJPE</small><strong id="paMetric">—</strong></div><div class="stat"><small>GT 尺度辅助 MPJPE</small><strong id="gtMetric">—</strong></div><div class="stat"><small>相机 MPJPE · GT 根深度辅助</small><strong id="cameraMetric">—</strong></div></div>
<div class="controls"><label>结果 <select id="variant"><option value="output">阶段输出</option><option value="raw">融合后未平滑</option></select></label><label>显示坐标 <select id="space"><option value="normalized">模型归一化坐标</option><option value="gtScale">GT 尺度辅助 mm</option><option value="pa">PA 对齐 mm</option><option value="camera">相机重建 mm · GT 根深度辅助</option></select></label></div>
<div class="controls"><label><input type="checkbox" id="showPrediction" checked>预测骨架</label><label><input type="checkbox" id="showGT" checked>GT 骨架</label></div></section>
<section><h2>当前样本</h2><div id="sampleDetails"></div></section>
<section><h2>源图片</h2><div class="imagebox"><img id="sourceImage" alt="对应源帧"><div id="imageMissing" class="muted">未提供源图片</div></div></section>
</aside></div><div class="note" id="scope"></div><div class="muted" id="help">基准模式仅覆盖末端 243 个样本。P_obs 是最后 10 个样本；稀疏图片不自动补帧。GT 尺度与 PA 对齐仅用于离线验证，模型输出未标定毫米尺度。N-MPJPE 只对齐尺度；PA-MPJPE 还对齐旋转和平移。指标 CSV 可用 Excel 打开。</div>
<div id="runtimeError" class="error" role="alert"></div></main>
<script>
"use strict";
const DATA=/*__POSE_DATA__*/;
const $=id=>document.getElementById(id), canvas=$('scene'),ctx=canvas.getContext('2d');
let frame=0,yaw=.35,pitch=-.12,zoom=1,playing=false,deadline=0,drag=null;
const parents=[-1,0,1,2,0,4,5,0,7,8,9,8,11,12,8,14,15];
const right=new Set([1,2,3,14,15,16]),left=new Set([4,5,6,11,12,13]);
const colors={right:'#72b5ef',left:'#ef8d8d',center:'#dce6ee',gt:'#adbbc7'};
const finitePoint=p=>p&&p.length===3&&p.every(Number.isFinite);
function isNormalized(){return $('space').value==='normalized'||!DATA.gt?.[frame]?.every(finitePoint);}
function skeleton(which){const variant=$('variant').value;const space=$('space').value;if(which==='gt')return DATA.gt?.[frame];if(isNormalized())return DATA[variant]?.[frame];if(space==='gtScale')return DATA[variant+'MM']?.[frame];if(space==='pa')return DATA[variant+'PA']?.[frame];if(space==='camera')return DATA[variant+'CameraMM']?.[frame];return DATA[variant]?.[frame];}
function project(point,w,h,scale){const [x,y,z]=point;const xr=x*Math.cos(yaw)+z*Math.sin(yaw),zr=-x*Math.sin(yaw)+z*Math.cos(yaw);const yr=y*Math.cos(pitch)-zr*Math.sin(pitch);return [w/2+xr*scale,h*.48+yr*scale];}
function drawSkeleton(points,isGT,w,h,scale){if(!points||!points.every(finitePoint))return;ctx.lineWidth=isGT?2:3;ctx.setLineDash(isGT?[5,4]:[]);for(let j=1;j<17;j++){const a=project(points[parents[j]],w,h,scale),b=project(points[j],w,h,scale);ctx.strokeStyle=isGT?colors.gt:right.has(j)?colors.right:left.has(j)?colors.left:colors.center;ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke();}ctx.setLineDash([]);for(let j=0;j<17;j++){const p=project(points[j],w,h,scale);ctx.fillStyle=isGT?colors.gt:right.has(j)?colors.right:left.has(j)?colors.left:colors.center;ctx.beginPath();ctx.arc(...p,isGT?2.5:4,0,Math.PI*2);ctx.fill();if(!isGT&&$('jointIndices').checked){ctx.fillStyle='#e5eaf0';ctx.fillText(j,p[0]+7,p[1]-5);}}}
function draw(){const rect=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,rect.width,rect.height);const normalized=isNormalized();const scale=rect.height*(normalized?1.05:.00053)*zoom;ctx.strokeStyle='#304151';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(20,rect.height*.48);ctx.lineTo(rect.width-20,rect.height*.48);ctx.stroke();ctx.font='12px system-ui';ctx.fillStyle='#a2afbd';ctx.fillText(normalized?($('space').value==='normalized'?'根相对 · 归一化单位':'当前样本无 GT · 归一化预测'):'根相对 · mm（离线对齐）',14,24);if($('showGT').checked&&!normalized)drawSkeleton(skeleton('gt'),true,rect.width,rect.height,scale);if($('showPrediction').checked)drawSkeleton(skeleton('prediction'),false,rect.width,rect.height,scale);ctx.fillStyle='#a2afbd';ctx.fillText('右侧：蓝 · 左侧：红 · 根关节 0',14,rect.height-16);}
const format=x=>Number.isFinite(x)?x.toFixed(2):'—';
function refresh(){const variant=$('variant').value,metric=DATA.metrics?.variants?.[variant];$('officialMetric').textContent=format(metric?.mpjpe_official_25d_mm?.mean);$('nMetric').textContent=format(metric?.n_mpjpe_mm?.mean);$('paMetric').textContent=format(metric?.pa_mpjpe_mm?.mean);$('gtMetric').textContent=format(metric?.mpjpe_gt_scale_mm?.mean);$('cameraMetric').textContent=format(metric?.mpjpe_camera_root_depth_mm?.mean);$('position').textContent=(frame+1)+' / '+DATA.frameIds.length;$('timeline').value=frame;const row=DATA.frameMetrics.find(r=>r.variant===variant&&r.frame_id===DATA.frameIds[frame]);const values=[['目标帧',DATA.frameIds[frame]],['源帧号',DATA.sourceIds[frame]],['时间戳',DATA.timestamps[frame].toFixed(3)+' s'],['融合窗口数',DATA.contributions[frame]],['当前 N-MPJPE',format(row?.n_mpjpe_mm)+' mm'],['当前 PA-MPJPE',format(row?.pa_mpjpe_mm)+' mm'],['当前相机 MPJPE · GT 根深度',format(row?.mpjpe_camera_root_depth_mm)+' mm'],['最后 10 帧观测',frame>=DATA.frameIds.length-10?'是':'否']];$('sampleDetails').replaceChildren(...values.map(([label,value])=>{const div=document.createElement('div');div.className='details';const a=document.createElement('span'),b=document.createElement('span');a.textContent=label;b.textContent=value;div.append(a,b);return div;}));const image=DATA.images[frame];$('sourceImage').style.display=image?'block':'none';$('imageMissing').style.display=image?'none':'block';if(image)$('sourceImage').src=image;draw();}
function nextDelay(){return frame<DATA.frameIds.length-1?(DATA.timestamps[frame+1]-DATA.timestamps[frame])*1000/Number($('speed').value):0;}
function setFrame(index,fromPlayback=false){frame=Math.max(0,Math.min(DATA.frameIds.length-1,index));if(playing&&!fromPlayback)deadline=performance.now()+nextDelay();refresh();}
function togglePlay(){playing=!playing;if(playing&&frame===DATA.frameIds.length-1)setFrame(0,true);deadline=performance.now()+nextDelay();$('play').textContent=playing?'暂停':'播放';}
function animate(now){if(playing&&now>=deadline){setFrame(frame+1,true);if(frame===DATA.frameIds.length-1){playing=false;$('play').textContent='播放';}else{deadline=now+nextDelay();}}requestAnimationFrame(animate);}
$('timeline').max=DATA.frameIds.length-1;$('timeline').oninput=()=>setFrame(Number($('timeline').value));$('previous').onclick=()=>setFrame(frame-1);$('next').onclick=()=>setFrame(frame+1);$('play').onclick=togglePlay;$('reset').onclick=()=>{yaw=.35;pitch=-.12;zoom=1;draw();};for(const id of ['variant','space','showPrediction','showGT','jointIndices'])$(id).onchange=refresh;
$('speed').onchange=()=>{if(playing)deadline=performance.now()+nextDelay();};
canvas.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);};canvas.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-drag.x)*.008;pitch=Math.max(-1.5,Math.min(1.5,pitch+(e.clientY-drag.y)*.008));drag={x:e.clientX,y:e.clientY};draw();};canvas.onpointerup=()=>drag=null;canvas.onpointercancel=()=>drag=null;canvas.onwheel=e=>{e.preventDefault();zoom=Math.max(.4,Math.min(3,zoom*Math.exp(-e.deltaY*.001)));draw();};window.addEventListener('resize',draw);window.addEventListener('error',e=>{$('runtimeError').textContent=e.message;document.body.dataset.viewerStatus='error';});
$('sequence').textContent=(DATA.metrics?.sequence||DATA.meta.video_id)+' · '+DATA.meta.pipeline_mode+' · '+DATA.frameIds.length+' 个样本 · PoseMamba-L · '+DATA.meta.output_settings.smoothing;
$('scope').textContent=DATA.metrics? (DATA.metrics.official_25d?'官方 P1 已按当前源帧的原版 2.5d_factor 和 2.5D 标注计算；仍不是完整测试集复现。 ':'')+`本次为单动作单相机诊断，实际采样约 ${DATA.metrics.sampling.median_effective_fps.toFixed(1)} FPS。模型尚不直接输出毫米。GT 尺度辅助使用近似尺度；相机 MPJPE 使用已验证相机参数与 GT 根深度，不拟合预测尺度或旋转；两者均为辅助诊断，区别于官方 2.5D P1。不能将这些结果直接与论文全测试集数字比较。`:'未提供三维标注，当前显示模型原始归一化姿态。';
if(!DATA.outputCameraMM)$('space').querySelector('option[value="camera"]').disabled=true;if(DATA.gt){$('space').value=DATA.outputCameraMM?'camera':'gtScale';}else{$('space').querySelectorAll('option:not([value="normalized"])').forEach(option=>option.disabled=true);$('showGT').disabled=true;}
refresh();requestAnimationFrame(animate);document.body.dataset.viewerStatus='ready';
</script></body></html>
