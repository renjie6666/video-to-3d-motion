[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-to-3d-motion"
version = "0.1.0"
description = "Stage-one media decoding and frame task pipeline for 3D human motion estimation."
requires-python = ">=3.10"
dependencies = [
    "av>=12.0,<17.0",
    "numpy>=1.24",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
pose2d = [
    "numpy>=1.24,<2",
    "torch==2.1.2",
    "torchvision==0.16.2",
    "mmengine==0.10.7",
    "mmcv==2.1.0",
    "mmdet==3.3.0",
    "mmpose==1.3.2",
    "opencv-python==4.10.0.84",
    "setuptools==80.9.0",
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118", extra = "pose2d" }
torchvision = { index = "pytorch-cu118", extra = "pose2d" }
mmcv = { url = "https://download.openmmlab.com/mmcv/dist/cu118/torch2.1.0/mmcv-2.1.0-cp310-cp310-win_amd64.whl", marker = "sys_platform == 'win32' and python_version == '3.10'", extra = "pose2d" }

[tool.uv.extra-build-dependencies]
mmcv = ["setuptools==80.9.0"]
chumpy = ["pip", "setuptools==80.9.0"]

[project.scripts]
decode-video = "video_to_3d_motion.media.cli:main"
decode-images = "video_to_3d_motion.media.cli:images_main"
estimate-pose2d-video = "video_to_3d_motion.pose2d.cli:video_main"
estimate-pose2d-images = "video_to_3d_motion.pose2d.cli:images_main"

[tool.setuptools.packages.find]
where = ["src"]
