[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-to-3d-motion"
version = "0.1.0"
description = "Stage-one media decoding and frame task pipeline for 3D human motion estimation."
requires-python = ">=3.10"
dependencies = ["av>=12.0,<17.0", "numpy>=1.24", "PyYAML>=6.0"]

[project.scripts]
decode-video = "video_to_3d_motion.media.cli:main"
decode-images = "video_to_3d_motion.media.cli:images_main"

[tool.setuptools.packages.find]
where = ["src"]
