# The experiment remains baseline; joint_schema follows the selected checkpoint.
pipeline_mode: baseline
# All relative paths below are relative to this YAML file's directory.

pose2d:
  active_model: rtmpose_l_h36m
  models:
    rtmpose_m:
      # AIC+COCO M at the same resolution and flip setting as both L models.
      config:
        baseline: models/mmpose/body_2d_keypoint/rtmpose/coco/rtmpose-m_8xb256-420e_aic-coco-384x288.py
      checkpoint:
        baseline: ../checkpoints/rtmpose-m_simcc-aic-coco_pt-aic-coco_420e-384x288-a62a0b32_20230228.pth
      joint_schema:
        baseline: coco17
      score_source: rtmpose_simcc
    rtmpose_l_h36m:
      # Kineo's public H36M-finetuned RTMPose-l is used as a baseline.
      # The model config defines input_size=(288, 384), in width/height order.
      config:
        baseline: project/h36m17/rtmpose-l_8xb256-420e_h36m-384x288.py
      checkpoint:
        baseline: ../checkpoints/rtmpose_h36m.pth
      joint_schema:
        baseline: h36m17
      score_source: rtmpose_simcc
    rtmpose_l:
      # Official AIC+COCO initialization used by the H36M-finetuned L model.
      # Both L models use input_size=(288, 384) and flip_test=False.
      config:
        baseline: models/mmpose/body_2d_keypoint/rtmpose/coco/rtmpose-l_8xb256-420e_aic-coco-384x288.py
      checkpoint:
        baseline: ../checkpoints/rtmpose-l_simcc-aic-coco_pt-aic-coco_420e-384x288-97d6cb0f_20230228.pth
      joint_schema:
        baseline: coco17
      score_source: rtmpose_simcc

detection:
  bbox_source: external_or_detector
  score_threshold: 0.30
  nms_iou_threshold: 0.65
  min_bbox_area: 256
  strict_single_person: true
  detector_config: models/mmdet/rtmdet/rtmdet_m_8xb32-300e_coco.py
  detector_checkpoint: ../checkpoints/rtmdet_m_8xb32-300e_coco_20220719_112220-229f527c.pth
  person_class_id: 0

batch:
  max_size: 27
  prefetch_batches: 4
  input_queue_capacity: 108
  output_queue_capacity: 54
  put_timeout_seconds: 0.5

runtime:
  amp: false
  keypoint_score_threshold: 0.20

visualization:
  enabled: true
  output_root: ../results/visualizations/pose2d
  image_format: jpg
  jpeg_quality: 95
  draw_bbox: true
  draw_skeleton: true
  draw_joint_index: false
  draw_frame_info: true
  every_n_frames: 1
  strict: true
